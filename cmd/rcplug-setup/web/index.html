<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcplug setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1015; --panel:#151a21; --panel2:#1c232c; --panel3:#232c37; --line:#2a333f;
    --fg:#e7edf3; --muted:#9aa8b6; --dim:#7d8a97; --accent:#19c37d; --accent-ink:#04261a;
    --amber:#e3a008; --red:#f85149; --blue:#2f81f7; --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top .logo{font-size:22px;color:var(--accent)} .top h1{font-size:16px;margin:0;font-weight:650}
  .spacer{flex:1}
  .pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .pill.ok{color:var(--fg)} .pill.ok .dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .pill.bad{color:#ffb3ae;border-color:var(--red)} .pill.bad .dot{background:var(--red)}
  main{max-width:860px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .card.off{opacity:.55;pointer-events:none}
  .card h2{margin:0 0 2px;font-size:16px} .card .desc{color:var(--muted);font-size:13px;margin:0 0 14px}
  .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--panel3);color:var(--muted);font-size:12px;margin-right:8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input[type=text],select{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  .sub{font-size:13px;font-weight:650;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--fg)}
  .sub:first-of-type{border-top:0;padding-top:0;margin-top:4px}
  .hint{font-size:12px;color:var(--dim);margin:6px 0 0} .hint.ok{color:var(--accent)} .hint.err{color:#ffb3ae}
  select option:disabled{color:var(--dim)}
  .bar{margin-top:12px;height:8px;border-radius:4px;background:var(--panel3);overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
  .barText{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .filerow{display:flex;gap:8px} .filerow input{flex:1;min-width:0;font-family:var(--mono);font-size:12px}
  .filerow select{flex:1;min-width:0;width:auto} .filerow #fwOther{flex:0 0 140px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:8px;padding:8px 14px}
  button:hover{border-color:var(--blue)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button.danger{color:var(--red);border-color:var(--red);background:transparent}
  button.small{padding:5px 10px;font-size:13px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--fg);cursor:pointer;margin-top:12px}
  .log{margin-top:12px;background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;color:#c9d4df}
  .banner{border:1px solid var(--amber);background:#2a2110;color:#ffe2a3;border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px}
  .banner a{color:#ffe2a3} .ok{color:var(--accent)} .err{color:#ffb3ae} .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  a{color:var(--blue)}
  /* file picker */
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,94vw);max-height:80vh}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dlg-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dlg-h .cur{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roots{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
  .roots button{padding:3px 10px;font-size:12px}
  .listing{overflow:auto;max-height:46vh;padding:6px 8px}
  .entry{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer}
  .entry:hover{background:var(--panel3)} .entry .ic{width:18px;text-align:center} .entry .sz{margin-left:auto;color:var(--dim);font-size:11px}
  .entry.dir{color:var(--fg)} .entry.file{color:var(--muted)}
  .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
  .dlg-b{padding:16px 18px} .dlg-b h3{margin:0 0 8px;font-size:16px} .dlg-b p{margin:0 0 10px;font-size:13px}
  .dlg-b .mono{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border-radius:8px;padding:8px 10px}
  button.danger:not(:disabled):hover{background:var(--red);color:#fff}
  /* flash pre-flight checks */
  .checks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
  .checks li{display:grid;grid-template-columns:18px 130px minmax(0,1fr);gap:8px;font-size:13px;align-items:baseline}
  .checks li.ok>span:first-child{color:var(--accent)} .checks li.warn>span:first-child{color:var(--amber)} .checks li.err>span:first-child{color:var(--red)}
  .checks .d{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .checks li.err .d{color:#ffb3ae}
  @media (max-width:520px){
    .top{flex-wrap:wrap;gap:8px;padding:10px 16px} .top h1{font-size:15px}
    main{padding:12px 10px}
    .filerow{flex-wrap:wrap} .filerow input{flex:1 1 100%} .filerow #fwOther{flex:1 1 100%}
    .checks li{grid-template-columns:18px minmax(0,1fr)} .checks .d{grid-column:2}
  }
</style>
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true">⚙</span>
  <h1>rcplug setup</h1>
  <span class="spacer"></span>
  <span class="pill" id="status"><span class="dot"></span><span id="statusText"></span></span>
  <button class="small" id="lang"></button>
  <button class="small" id="quit"></button>
</header>
<main>
  <section class="card" id="cardConnect">
    <h2><span class="step">1</span><span data-t="connTitle"></span></h2>
    <p class="desc" data-t="connDesc"></p>
    <label for="host" data-t="host"></label>
    <input type="text" id="host" placeholder="192.168.1.50" autocomplete="off">
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:140px"><label for="user" data-t="user"></label><input type="text" id="user" value="root"></div>
    </div>
    <label data-t="keyFile"></label>
    <div class="filerow"><input type="text" id="connKey" placeholder="~/.ssh/rodecaster"><button class="small" data-browse="connKey" data-mode="file" data-t="browse"></button></div>
    <div class="row"><button class="primary" id="btnConnect" data-t="connect"></button></div>
    <div class="log" id="connLog" hidden></div>
  </section>

  <section class="card" id="cardCfw">
    <h2><span class="step">2</span><span data-t="cfwTitle"></span></h2>
    <p class="desc" data-t="cfwDesc"></p>
    <div class="banner" id="cfwBanner" data-t="cfwBanner"></div>
    <label for="fwDevice" data-t="fwDevice"></label>
    <select id="fwDevice"></select>
    <p class="hint" id="devHint"></p>
    <h3 class="sub" data-t="fwTitle"></h3>
    <label for="fwPick" data-t="fwVersion"></label>
    <div class="filerow"><select id="fwPick"></select><input type="text" id="fwOther" placeholder="1.7.3" hidden></div>
    <p class="hint" id="fwInfo"></p>
    <label data-t="fwDir"></label>
    <div class="filerow"><input type="text" id="fwDir" placeholder="…"><button class="small" data-browse="fwDir" data-mode="dir" data-t="browse"></button></div>
    <div class="row"><button class="primary" id="btnFw" data-t="fwDownload"></button><button class="small" id="btnFwCancel" data-t="cancel" hidden></button></div>
    <div class="bar" id="fwBar" hidden><div></div></div>
    <div class="barText" id="fwBarText" hidden></div>
    <div class="log" id="fwLog" hidden></div>
    <h3 class="sub" data-t="cfwKeyTitle"></h3>
    <label data-t="cfwRootfs"></label>
    <div class="filerow"><input type="text" id="cfwIn" placeholder="rodecaster-duo-…-os.tar.gz"><button class="small" data-browse="cfwIn" data-mode="file" data-t="browse"></button></div>
    <p class="hint" id="cfwInInfo"></p>
    <label data-t="cfwKey"></label>
    <div class="filerow"><input type="text" id="cfwKey" placeholder="~/.ssh/rodecaster.pub"><button class="small" data-browse="cfwKey" data-mode="file" data-t="browse"></button><button class="small" id="btnGenKey" data-t="genKey"></button></div>
    <label data-t="cfwOut"></label>
    <div class="filerow"><input type="text" id="cfwOut" placeholder="out/"><button class="small" data-browse="cfwOut" data-mode="dir" data-t="browse"></button></div>
    <div class="row"><button class="primary" id="btnCfw" data-t="cfwBuild"></button></div>
    <p class="hint err" id="cfwNoKeys" hidden></p>
    <div class="log" id="cfwLog" hidden></div>
  </section>

  <section class="card" id="cardFlash">
    <h2><span class="step">3</span><span data-t="flashTitle"></span></h2>
    <p class="desc" data-t="flashDesc"></p>
    <div class="banner" data-t="flashBanner"></div>
    <p class="hint err" id="flashOS" hidden></p>
    <label data-t="flashDir"></label>
    <div class="filerow"><input type="text" id="flashDir" placeholder="out/"><button class="small" data-browse="flashDir" data-mode="dir" data-t="browse"></button><button class="small" id="btnFlashCheck" data-t="flashCheck"></button></div>
    <ul class="checks" id="flashChecks" hidden></ul>
    <p class="hint" id="flashState"></p>
    <div class="log" id="flashUdev" hidden></div>
    <p class="hint" data-t="flashHow"></p>
    <div class="row"><button id="btnStage" data-t="flashStage" disabled></button><button class="danger" id="btnFlash" data-t="flashGo" disabled></button></div>
    <div class="log" id="flashLog" hidden></div>
  </section>

  <section class="card off" id="cardInstall">
    <h2><span class="step">4</span><span data-t="installTitle"></span></h2>
    <p class="desc" data-t="installDesc"></p>
    <label data-t="payload"></label>
    <div class="filerow"><input type="text" id="payload" placeholder="rcplug-…-aarch64.tar.gz"><button class="small" data-browse="payload" data-mode="file" data-t="browse"></button></div>
    <div class="row">
      <button class="primary" id="btnInstall" data-t="install"></button>
      <span class="spacer"></span>
      <input type="text" id="pluginDir" placeholder="…/my-plugin" aria-label="plugin folder" style="flex:1;min-width:140px">
      <button class="small" data-browse="pluginDir" data-mode="dir" data-t="browse"></button>
      <button class="small" id="btnPlugin" data-t="addPlugin"></button>
    </div>
    <div class="log" id="installLog" hidden></div>
  </section>

  <section class="card off" id="cardMore">
    <h2><span class="step">5</span><span data-t="moreTitle"></span></h2>
    <p class="desc" data-t="moreDesc"></p>
    <div class="filerow"><input type="text" id="diagDir" placeholder="…"><button class="small" data-browse="diagDir" data-mode="dir" data-t="browse"></button><button class="small primary" id="btnDiag" data-t="diag"></button></div>
    <div class="row">
      <button class="small" id="btnPushKey" data-t="pushKey"></button>
      <button class="small" id="btnStop" data-t="stopRcplug"></button>
      <button class="small" id="btnStart" data-t="startRcplug"></button>
      <button class="small" id="btnResetAccess" data-t="resetAccess"></button>
      <span class="spacer"></span>
      <button class="small danger" id="btnUninstall" data-t="uninstall"></button>
    </div>
    <div class="log" id="moreLog" hidden></div>
  </section>
</main>

<dialog id="picker">
  <div class="dlg-h"><button class="small" id="pkUp">↑</button><span class="cur" id="pkCur"></span></div>
  <div class="roots" id="pkRoots"></div>
  <div class="listing" id="pkList"></div>
  <div class="dlg-f"><span class="muted" id="pkHint" style="margin-right:auto;font-size:12px"></span><button id="pkCancel" data-t="cancel"></button><button class="primary" id="pkChoose" data-t="chooseFolder"></button></div>
</dialog>

<dialog id="flashDlg">
  <div class="dlg-b">
    <h3 data-t="flashConfirmTitle"></h3>
    <p data-t="flashConfirmText"></p>
    <p class="mono" id="flashSummary"></p>
    <label for="flashWord" data-t="flashTypeWord"></label>
    <input type="text" id="flashWord" autocomplete="off" spellcheck="false" placeholder="flash">
  </div>
  <div class="dlg-f"><button id="flashNo" data-t="cancel"></button><button class="danger" id="flashYes" data-t="flashNow" disabled></button></div>
</dialog>

  const list = $('#pkList'); list.innerHTML = '';
  (d.dirs || []).forEach((e) => list.appendChild(entry(e, true)));
  if (pickMode === 'file') (d.files || []).forEach((e) => list.appendChild(entry(e, false)));
  $('#pkUp').onclick = () => d.parent && loadDir(d.parent);
}
function entry(e, isDir) {
  const div = document.createElement('div');
  div.className = 'entry ' + (isDir ? 'dir' : 'file');
  div.innerHTML = '<span class="ic">' + (isDir ? '📁' : '📄') + '</span>';
  const name = document.createElement('span'); name.textContent = e.name; div.appendChild(name);
  if (!isDir) { const sz = document.createElement('span'); sz.className = 'sz'; sz.textContent = fmtSize(e.size); div.appendChild(sz); }
  div.onclick = () => { if (isDir) loadDir(e.path); else { setPicked(e.path); $('#picker').close(); } };
  return div;
}
function fmtSize(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(0) + ' KB'; return (n / 1048576).toFixed(1) + ' MB'; }
function setPicked(v) { const el = $('#' + pickTarget); el.value = v; el.dispatchEvent(new Event('change')); }
$('#pkChoose').addEventListener('click', () => { setPicked(pickPath); $('#picker').close(); });
$('#pkCancel').addEventListener('click', () => $('#picker').close());

(async () => {
  applyText();
  setConnected(false);
  try {
    const env = await api('env');
    if (env.defaultPayload) $('#payload').value = env.defaultPayload;
    // From the command line (--host, --user, --key, --payload).
    if (env.host) $('#host').value = env.host;
    if (env.user) $('#user').value = env.user;
    if (env.key) $('#connKey').value = env.key;
    if (env.connected) { // the page was reloaded; the connection is still there
      setConnected(true);
      showLog('#connLog', t('connected') + ': ' + env.connected.target, 'ok');
      connectedDevice = env.connected.device || null;
    }
    if (env.home) { $('#cfwOut').value = (env.cwd || env.home); $('#diagDir').value = (env.cwd || env.home); $('#fwDir').value = (env.cwd || env.home); $('#flashDir').value = (env.cwd || env.home); }
    if (env.flash === false) { $('#flashOS').hidden = false; $('#flashOS').textContent = t('flashUnsupported'); }
  } catch (e) {}
  try { const p = await api('flash/progress'); if (p.state === 'running') { $('#flashDir').value = p.dir; pollFlash(); } } catch (e) {}
  await loadDevices();
  deviceChanged('');
})();
</script>
</body>
