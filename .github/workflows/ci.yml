name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Everything is built and tested with the current Go release, as the release
# files are; the "minimum Go" job keeps the go.mod version working.
jobs:
  test:
    name: Go tests, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: gofmt, vet (also as Windows code), race tests, shellcheck, doc links
        run: make check

  minimum-go:
    name: Tests with the minimum Go version (go.mod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  windows:
    name: Flash and setup tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./internal/flash ./cmd/rcplug-flash ./cmd/rcplug-setup

  installer:
    name: Installer end-to-end test (sandbox) with rcplug
    # It checks out the rcplug repository, which GitHub only allows while it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rcplug-toolkit
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/rcplug
          path: rcplug
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make -C rcplug-toolkit installer-test RCPLUG=../rcplug

  package:
    name: Release files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: rcplug-toolkit
          path: |
            dist/rcplug-toolkit-*-windows.zip
            dist/rcplug-setup-*
            dist/rcplug-cfw-*
            dist/rcplug-flash-*
            dist/rcplug-wizard.sh
            dist/rcplug-remote.sh
            dist/SHA256SUMS
