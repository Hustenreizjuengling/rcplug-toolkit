name: Web pages

# The toolkit in the browser (web/, see tools/sitegen), on GitHub Pages:
#
# - the site itself from the latest published release, never from
#   unreleased code;
# - /next/ from main, a preview for testing (a banner on every page, not
#   indexed, no downloads), like the "Development build" pre-release.
#
# Built after each release, after pushes to main that change the pages, once
# a day for RØDE's current firmware list (firmware.json), or by hand
# (Actions → Web pages → Run workflow).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ['web/**', 'cmd/rcplug-web/**', 'internal/cfw/**', 'internal/fwimage/**', 'internal/fwdl/**', 'tools/sitegen/**', 'go.mod', 'go.sum', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: The site, from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the latest published release, not just the highest tag (a tag
          # whose release run failed is never published)
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          case "$tag" in v[0-9]*) ;; *) echo "no release: '$tag'"; exit 1 ;; esac
          git worktree add --quiet --detach ../release "refs/tags/$tag"
          echo "Building the site from $tag"
          (cd ../release && go run ./tools/sitegen -out "$GITHUB_WORKSPACE/_site" -require-firmware)
      - name: The preview, from main
        run: go run ./tools/sitegen -out _site/next -preview -require-firmware
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
