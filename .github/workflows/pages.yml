name: Web pages

# The toolkit in the browser (web/, see tools/sitegen), on GitHub Pages. It is
# built from the latest release, never from unreleased code: after each
# release, once a day for RØDE's current firmware list (firmware.json), or by
# hand (Actions → Web pages → Run workflow).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the latest published release, not just the highest tag (a tag
          # whose release run failed is never published)
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          case "$tag" in v[0-9]*) ;; *) echo "no release: '$tag'"; exit 1 ;; esac
          git checkout --quiet "refs/tags/$tag"
          echo "Building the pages of $tag"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go run ./tools/sitegen -out _site -require-firmware
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
