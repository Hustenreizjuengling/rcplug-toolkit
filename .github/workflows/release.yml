name: Release

# A release is published in one of two ways:
#
# - Push a tag v<version> that matches VERSION.
# - Or click: Actions → Release → Run workflow (or `gh workflow run release.yml
#   -f version=X.Y.Z`). That dates the newest "Unreleased" section of
#   CHANGELOG.md as the version, sets VERSION, commits and tags; the same run
#   then builds and publishes, and finally starts the next patch version's
#   "Unreleased" section. (A tag pushed by a workflow does not start other
#   workflows, which is why one run does all of it.)
#
# The Windows zip includes the device package of rcplug's latest release, so
# release rcplug first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (empty: the one in VERSION)'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Date the changelog, set the version, tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: tag
        env:
          WANT: ${{ inputs.version }}
        run: |
          v="${WANT:-$(cat VERSION)}"
          tools/release-version.sh prepare "$v"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $v"
          git tag "v$v"
          git push origin HEAD:main "v$v"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: prepare
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "$TAG"
      - name: The latest rcplug device package, for the Windows zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p payload
          gh release download --repo "${{ github.repository_owner }}/rcplug" --pattern 'rcplug-[0-9]*-aarch64.tar.gz' --dir payload || true
          ls payload
      - name: Test and build
        run: |
          payload=""
          for f in payload/rcplug-*-aarch64.tar.gz; do [ -f "$f" ] && payload="$f"; done
          make test package PAYLOAD="$payload"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="$(cat VERSION)" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} /^## / && p {exit} p' CHANGELOG.md)"
          gh release create "$TAG" --verify-tag --title "rcplug-toolkit $TAG" --notes "$notes" \
            dist/rcplug-toolkit-*-windows.zip dist/rcplug-setup-* dist/rcplug-cfw-* dist/rcplug-flash-* \
            dist/rcplug-wizard.sh dist/rcplug-remote.sh dist/SHA256SUMS

  next:
    name: Start the next version
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          tools/release-version.sh next
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Start $(cat VERSION)"
          git push origin HEAD:main
